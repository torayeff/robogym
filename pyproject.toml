[project]
name = "robogym"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "mujoco>=3.14.0",
    "opencv-python-headless>=5.0.0.93",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
