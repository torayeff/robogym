[project]
name = "robogym"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "av>=19.0.1",
    "fastapi>=0.142.2",
    "mujoco>=3.14.0",
    "opencv-python-headless>=5.0.0.93",
    "uvicorn>=0.54.0",
]

[project.scripts]
robogym = "robogym.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "modal>=1.6.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[tool.pytest]
testpaths = ["tests"]
