<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>robogym</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: #ccc; font: 16px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    p { margin: 2em; }
  </style>
</head>
<body>
  <canvas></canvas>
  <script type="module">
    // Shows /video, the simulation's default view, as robogym/viewer.py streams it.
    const canvas = document.querySelector("canvas");
    const context = canvas.getContext("2d");

    async function play() {
      const decoder = new VideoDecoder({
        output(frame) {
          if (canvas.width !== frame.displayWidth) canvas.width = frame.displayWidth;
          if (canvas.height !== frame.displayHeight) canvas.height = frame.displayHeight;
          context.drawImage(frame, 0, 0);
          frame.close();
        },
        error: console.error,
      });
      // High profile, level 3.1: what robogym/viewer.py encodes.
      decoder.configure({ codec: "avc1.64001f", optimizeForLatency: true });
      try {
        const reader = (await fetch("/video")).body.getReader();
        let pending = new Uint8Array(0);
        let timestamp = 0;
        while (true) {
          const { value, done } = await reader.read();
          if (done) return;
          pending = concat(pending, value);
          // Each frame is a 4-byte little-endian length, a keyframe flag byte, and the frame.
          while (pending.length >= 5) {
            const size = new DataView(pending.buffer, pending.byteOffset).getUint32(0, true);
            if (pending.length < 5 + size) break;
            const chunk = new EncodedVideoChunk({
              type: pending[4] ? "key" : "delta",
              timestamp: timestamp++,
              data: pending.subarray(5, 5 + size),
            });
            decoder.decode(chunk);
            pending = pending.subarray(5 + size);
          }
        }
      } finally {
        if (decoder.state !== "closed") decoder.close();
      }
    }

    function concat(a, b) {
      const joined = new Uint8Array(a.length + b.length);
      joined.set(a);
      joined.set(b, a.length);
      return joined;
    }

    if ("VideoDecoder" in window) {
      // Reconnect a second after the stream ends, e.g. when the server restarts.
      while (true) {
        await play().catch(console.error);
        await new Promise((resolve) => setTimeout(resolve, 1000));
      }
    } else {
      document.body.innerHTML = "<p>Can't decode the video here: open this page from localhost or over HTTPS, in a current browser.</p>";
    }
  </script>
</body>
</html>
